[project]
name = "server"
version = "0.1.0"
description = "FastAPI server application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.29.0",
    "bcrypt>=4.0.0",
    "email-validator>=2.0.0",
    "fastapi[standard]>=0.110.0",
    "httpx>=0.27.0",
    "PyJWT>=2.8.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic-settings>=2.2.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "stellar-sdk[aiohttp]>=12.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
